<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>Brands Slider</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>
        <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-element-bundle.min.js"></script>
    </head>
    <body>
        <div class="brand__container">
            <header class="content__section-header">
             REPAIR EQUIPMENT FROM VARIOUS BRANDS
            </header>
            
            <section class="brands__slider swiper">  
                <div class="swiper-wrapper">
                    <div class="swiper-slide">
                        <div class="brand-card">
                            <div class="brand-card__content">
                                <img src="assets/Logos/Lenovo.svg" alt="Lenovo Logo" class="brand-card__logo" />
                                <button class="brand-card__button" aria-label="View Lenovo repairs">
                                    <img src="assets/icons/GoIcon.svg" alt="arrow right" class="brand-card__icon" />
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="swiper-slide">
                        <div class="brand-card">
                            <div class="brand-card__content">
                                <img src="assets/Logos/Bosch.svg" alt="Bosch Logo" class="brand-card__logo" />
                                <button class="brand-card__button" aria-label="View Bosch repairs">
                                    <img src="assets/icons/GoIcon.svg" alt="arrow right" class="brand-card__icon" />
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="swiper-slide">
                        <div class="brand-card">
                            <div class="brand-card__content">
                                <img src="assets/Logos/Samsung.svg" alt="Samsung Logo" class="brand-card__logo" />
                                <button class="brand-card__button" aria-label="View Samsung repairs">
                                    <img src="assets/icons/GoIcon.svg" alt="arrow right" class="brand-card__icon" />
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="swiper-slide">
                        <div class="brand-card">
                            <div class="brand-card__content">
                                <img src="assets/Logos/Apple.svg" alt="Apple Logo" class="brand-card__logo" />
                                <button class="brand-card__button" aria-label="View Apple repairs">
                                    <img src="assets/icons/GoIcon.svg" alt="arrow right" class="brand-card__icon" />
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="swiper-slide">
                        <div class="brand-card">
                            <div class="brand-card__content">
                                <img src="assets/Logos/acer.svg" alt="Acer Logo" class="brand-card__logo" />
                                <button class="brand-card__button" aria-label="View Acer repairs">
                                    <img src="assets/icons/GoIcon.svg" alt="arrow right" class="brand-card__icon" />
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="swiper-slide">
                        <div class="brand-card">
                            <div class="brand-card__content">
                                <img src="assets/Logos/hp.svg" alt="HP Logo" class="brand-card__logo" />
                                <button class="brand-card__button" aria-label="View HP repairs">
                                    <img src="assets/icons/GoIcon.svg" alt="arrow right" class="brand-card__icon" />
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="swiper-slide">
                        <div class="brand-card">
                            <div class="brand-card__content">
                                <img src="assets/Logos/ViewSonic.svg" alt="ViewSonic Logo" class="brand-card__logo" />
                                <button class="brand-card__button" aria-label="View ViewSonic repairs">
                                    <img src="assets/icons/GoIcon.svg" alt="arrow right" class="brand-card__icon" />
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="swiper-pagination"></div>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
            </section>
            
            <button class="brands__toggle">
                <img src="assets/icons/ExpandIcon.svg" alt="expand icon" class="brands__toggle-icon" />
                <span class="brands__toggle-label">Show all</span>
            </button>
        </div>
        
        <script src="js/brand-swiper.js"></script>
    </body>
</html>
