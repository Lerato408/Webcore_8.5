<!DOCTYPE html>
<html lang="en">
    <head>
     <meta charset="UTF-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
     <title>Web-core final swiper</title>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>
     <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    </head>
    <body>
        <section class="brand-swiper swiper">
            <header class="brand-swiper__header">REPAIR EQUIPMENT FROM VARIOUS BRANDS</header> 
            <div class="brand-swiper__wrapper swiper-wrapper">
                <div class="brand-swiper__slide swiper-slide">
                    <span class="brand-name Lenovo">
                        <img src="Logos/Lenovo.svg" alt="Lenovo Logo" class="brand-logo">
                        <button class="arrow-btn" >
                            <img src="icons/GoIcon.svg" alt="arrow right" class="arrow-right">
                        </button>
                    </span></div>
                <div class="brand-swiper__slide swiper-slide"><span>Slide 2</span></div>
                <div class="brand-swiper__slide swiper-slide"><span>Slide 3</span></div>
                <div class="brand-swiper__slide swiper-slide">Slide 4</div>
                <div class="brand-swiper__slide swiper-slide">Slide 5</div>
                <div class="brand-swiper__slide swiper-slide">Slide 6</div>
                <div class="brand-swiper__slide swiper-slide">Slide 7</div>
                <div class="brand-swiper__slide swiper-slide">Slide 8</div>
                <div class="brand-swiper__slide swiper-slide">Slide 9</div>
                <div class="brand-swiper__slide swiper-slide">Slide 10</div>
                <div class="brand-swiper__slide swiper-slide">Slide 11</div>
                <div class="brand-swiper__slide swiper-slide">Slide 12</div>
            </div>
            <div class="swiper-pagination"></div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </section>
        <script src="Swiper.js"></script>
    </body>
</html>
